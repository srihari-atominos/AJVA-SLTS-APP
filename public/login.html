<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — SLTS</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1a2233; --muted:#6b7486; --accent:#1d4ed8; --border:#e2e5ea; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 380px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13.5px; margin-bottom: 20px; }
  .sso-btn {
    width: 100%; padding: 11px; border: 1px solid #16803c; background: #16803c; color: #fff;
    border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 14px;
  }
  .sso-btn:hover { background: #126631; }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin: 16px 0; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 12px 0 4px; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
  }
  button.submit {
    width: 100%; margin-top: 18px; padding: 11px; border: 1px solid var(--accent); background: var(--accent);
    color: #fff; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  button.submit:hover:not(:disabled) { background: #1a3fc4; }
  button.submit:disabled { opacity: .6; cursor: default; }
  .msg { margin-top: 14px; padding: 9px 12px; border-radius: 8px; font-size: 13px; }
  .msg.err { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .msg.info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
  .alt { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .alt a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .alt a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <h1>SLTS</h1>
    <div class="sub">Sign in to continue</div>

    <button class="sso-btn" id="ssoBtn">Sign in with Windows</button>
    <div class="divider">or</div>

    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button class="submit" type="submit" id="submitBtn">Sign in</button>
    </form>

    <div id="msg"></div>
    <div class="alt">New here? <a href="/signup.html">Create an account</a></div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const msgEl = document.getElementById('msg');
  if (params.get('sso') === 'unlinked') {
    msgEl.className = 'msg info';
    msgEl.textContent = 'Your Windows account isn\'t linked to an account here yet. Sign in with your email and password, then link it from there.';
  } else if (params.get('sso') === 'unavailable') {
    msgEl.className = 'msg info';
    msgEl.textContent = 'Windows sign-in isn\'t available from here. Use your email and password instead.';
  } else if (params.get('sso') === 'domain') {
    msgEl.className = 'msg info';
    msgEl.textContent = 'Your Windows domain isn\'t allowed to sign in here. Use your email and password instead.';
  }

  document.getElementById('ssoBtn').addEventListener('click', () => {
    location.href = '/auth/sso';
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';
    msgEl.className = ''; msgEl.textContent = '';
    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      const d = await res.json();
      if (!res.ok) throw new Error(d.error || 'Sign in failed');
      location.href = '/';
    } catch (err) {
      msgEl.className = 'msg err';
      msgEl.textContent = String(err.message || err);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
