<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SLTS</title>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script src="/sidebar.js"></script>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1a2233; --muted: #6b7486;
    --accent: #1d4ed8; --border: #e2e5ea; --row-hover: #eef2fb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { width: 100%; box-sizing: border-box; margin: 0; padding: 24px 24px; overflow-x: clip; }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; }
  .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .sub { color: var(--muted); font-size: 14px; margin: 6px 0 8px; }
  .last-updated {
    display: inline-block; margin: 0 0 18px; padding: 6px 12px; border-radius: 999px;
    background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; font-size: 13px; font-weight: 600;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  select, input[type=text] {
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; background: var(--card); color: var(--text); min-width: 220px;
  }
  input[type=text] { flex: 1; min-width: 260px; }
  input[type=text].exact { border-color: var(--accent); background: #eef2fb; }
  select.narrow { min-width: 130px; }
  .search-box { position: relative; flex: 1; min-width: 260px; display: flex; }
  .search-box input { flex: 1; }
  .exact-tag {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-size: 11px; font-weight: 700; color: var(--accent); background: #dce4fb;
    padding: 2px 7px; border-radius: 999px; pointer-events: none;
  }
  button.search {
    padding: 9px 16px; border: 1px solid var(--border); background: var(--card);
    color: var(--text); border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
    white-space: nowrap;
  }
  button.search:hover { background: var(--row-hover); }
  button.clear {
    padding: 9px 16px; border: 1px solid var(--border); background: var(--card);
    color: var(--muted); border-radius: 8px; font-size: 14px; cursor: pointer;
    white-space: nowrap;
  }
  button.clear:hover:not(:disabled) { background: var(--row-hover); color: var(--text); }
  button.clear:disabled { opacity: .4; cursor: default; }
  button.export {
    padding: 9px 16px; border: 1px solid var(--accent); background: var(--accent);
    color: #fff; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
    white-space: nowrap;
  }
  button.export:disabled { opacity: .5; cursor: default; }
  button.export:hover:not(:disabled) { background: #1a3fc4; }
  button.import {
    padding: 9px 16px; border: 1px solid #16803c; background: #16803c;
    color: #fff; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
    white-space: nowrap;
  }
  button.import:disabled { opacity: .5; cursor: default; }
  button.import:hover:not(:disabled) { background: #126631; }
  a.manage-users {
    padding: 9px 14px; border: 1px solid var(--border); background: #fff; color: var(--text);
    border-radius: 8px; font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
  }
  a.manage-users:hover { background: var(--row-hover); }
  .user-chip {
    display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px;
    border: 1px solid var(--border); border-radius: 999px; background: #fff;
  }
  .user-name { font-size: 13px; font-weight: 600; }
  .user-role {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
    color: var(--muted); background: var(--bg); padding: 2px 8px; border-radius: 999px;
  }
  button.logout {
    padding: 5px 12px; border: 1px solid var(--border); background: #fff; color: var(--muted);
    border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  button.logout:hover { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
  a.link-windows { color: var(--accent); font-weight: 600; }
  .link-banner {
    position: relative; margin-bottom: 16px; padding: 10px 36px 10px 14px; border-radius: 10px;
    font-size: 13.5px; font-weight: 600;
  }
  .link-banner.ok { background: #f0fdf4; color: #16803c; border: 1px solid #bbf7d0; }
  .link-banner.err { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .link-banner .banner-close {
    position: absolute; top: 6px; right: 8px; border: none; background: none; cursor: pointer;
    font-size: 15px; color: inherit; opacity: .7; padding: 2px 6px;
  }
  .link-banner .banner-close:hover { opacity: 1; }

  .upload-banner {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; margin-bottom: 16px; position: relative;
  }
  .upload-banner .banner-close {
    position: absolute; top: 10px; right: 12px; border: none; background: none;
    color: var(--muted); font-size: 16px; cursor: pointer; line-height: 1; padding: 2px 6px;
  }
  .upload-banner .banner-close:hover { color: var(--text); }
  .upload-summary { font-size: 13px; font-weight: 600; padding-right: 24px; }
  .upload-banner ul { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13px; }
  .upload-banner li { padding: 3px 0; display: flex; gap: 8px; align-items: baseline; }
  .tag-ok { color: #16803c; font-weight: 700; min-width: 64px; }
  .tag-updated { color: #b45309; font-weight: 700; min-width: 64px; }
  .tag-err { color: #b91c1c; font-weight: 700; min-width: 64px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); }
  th { background: #f0f2f6; font-weight: 600; white-space: nowrap; position: sticky; top: 0; }
  tbody tr:hover { background: var(--row-hover); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  /* "what happened in the last update" markers on the Time column */
  .prev-time { color: var(--muted); font-weight: 400; margin-right: 6px; }
  .chg {
    display: inline-block; margin-right: 8px; padding: 1px 7px; border-radius: 999px;
    font-size: 10px; font-weight: 700; letter-spacing: .04em; vertical-align: middle;
  }
  .chg-new { background: #dcfce7; color: #16803c; }
  .chg-mod { background: #fef3c7; color: #b45309; }
  /* Column chooser */
  .table-scroll { overflow-x: auto; }
  .cols-picker { position: relative; }
  button.cols-btn {
    padding: 9px 16px; border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  button.cols-btn:hover { background: var(--row-hover); }
  .cols-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; min-width: 240px; max-height: 420px; overflow-y: auto;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 0;
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
    max-width: calc(100vw - 32px);
  }
  .cols-menu.align-right { left: auto; right: 0; }
  .cols-menu-head {
    display: flex; align-items: center; gap: 6px; padding: 4px 12px 8px; margin-bottom: 4px;
    border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
  }
  .cols-menu-head span { flex: 1; }
  .cols-menu-head button {
    padding: 3px 9px; border: 1px solid var(--border); background: #fff; border-radius: 999px;
    font-size: 11.5px; font-weight: 600; cursor: pointer; text-transform: none; letter-spacing: 0;
  }
  .cols-menu-head button:hover { background: var(--row-hover); }
  .cols-item { display: flex; align-items: center; gap: 8px; padding: 6px 14px; font-size: 13.5px; cursor: pointer; user-select: none; }
  .cols-item:hover { background: var(--row-hover); }
  .cols-item input { margin: 0; cursor: pointer; }
  /* "New items" / "Time modified" checkboxes in the filter bar */
  .change-toggles { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; width: 100%; }
  .change-toggles .toggle {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--border);
    border-radius: 999px; background: var(--card); font-size: 13.5px; font-weight: 600; cursor: pointer; user-select: none;
  }
  .change-toggles .toggle.on { border-color: var(--accent); background: #eef2fb; }
  .change-toggles .toggle input { margin: 0; cursor: pointer; }
  .change-toggles .toggle .chg { margin: 0; }
  .change-toggles .toggle-hint { color: var(--muted); font-size: 12.5px; }
  .code { font-family: Consolas, monospace; font-size: 14px; color: var(--accent); white-space: nowrap; }
  .muted { color: var(--muted); }
  .pager { display: flex; align-items: center; gap: 12px; padding: 12px; justify-content: flex-end; }
  .pager button {
    padding: 7px 14px; border: 1px solid var(--border); background: var(--card);
    border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .pager button:disabled { opacity: .4; cursor: default; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .tablewrap { max-height: 65vh; overflow: auto; }

  button.row-edit {
    padding: 5px 14px; border: 1px solid var(--accent); background: #fff;
    color: var(--accent); border-radius: 6px; font-size: 12.5px; font-weight: 700;
    cursor: pointer; white-space: nowrap;
  }
  button.row-edit:hover { background: var(--accent); color: #fff; }

  /* VIN search: its own row above the filters, 17 characters, clears everything else */
  .vin-row { align-items: center; margin-bottom: 12px; }
  .vin-row > label { font-weight: 700; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .vin-box { position: relative; display: flex; flex: 0 1 380px; min-width: 280px; }
  .vin-box input { flex: 1; min-width: 0; font-family: Consolas, monospace; font-size: 15px; letter-spacing: .12em; padding-right: 56px; }
  .vin-box .vin-count { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 11.5px; color: var(--muted); pointer-events: none; }
  .vin-box .vin-count.full { color: #16803c; font-weight: 700; }
  button.vin-find {
    padding: 9px 16px; border: 1px solid var(--accent); background: var(--accent); color: #fff;
    border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  button.vin-find:hover:not(:disabled) { background: #1a3fc4; }
  button.vin-find:disabled { opacity: .5; cursor: default; }
  .vin-hint { font-size: 12.5px; color: var(--muted); }
  .vin-banner { position: relative; margin: 0 0 16px; padding: 10px 36px 10px 14px; border-radius: 10px; font-size: 13.5px; line-height: 1.5; }
  .vin-banner.ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #14532d; }
  .vin-banner.warn { background: #fffbeb; border: 1px solid #fde68a; color: #78350f; }
  .vin-banner.err { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
  .vin-banner .banner-close { position: absolute; top: 6px; right: 8px; border: none; background: none; cursor: pointer; font-size: 16px; color: inherit; opacity: .7; padding: 2px 6px; }
  .vin-banner .banner-close:hover { opacity: 1; }
  .vin-banner .vin-title { font-weight: 600; }
  .vin-banner .vin-title code { font-family: Consolas, monospace; font-size: 13px; }
  .vin-banner .vin-meta { font-size: 12.5px; opacity: .85; margin-top: 2px; }
  .vin-choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  button.vin-choice { padding: 6px 12px; border: 1px solid currentColor; background: #fff; color: inherit; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  button.vin-choice.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .vin-map-form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .vin-map-form select { min-width: 280px; }
  .vin-map-error { color: #b91c1c; font-size: 12.5px; }

  /* Eye button (leftmost column): opens the full-row details popup */
  th.view-col, td.view-col { width: 40px; padding-left: 10px; padding-right: 2px; }
  button.row-view {
    display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
    border: 1px solid var(--border); background: #fff; color: var(--muted); border-radius: 999px;
    cursor: pointer; padding: 0; vertical-align: middle;
  }
  button.row-view svg { width: 16px; height: 16px; display: block; }
  button.row-view:hover { border-color: var(--accent); color: var(--accent); background: var(--row-hover); }
  .modal.wide { max-width: 820px; }
  .modal.wide .field-grid { grid-template-columns: 1fr 1fr 1fr; }
  .modal.wide .field.span-2 { grid-column: span 2; }
  .modal.wide .field.span-3 { grid-column: 1 / -1; }
  .detail-group {
    grid-column: 1 / -1; font-size: 11.5px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: .05em; margin-top: 6px; padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .detail-group:first-child { margin-top: 0; }
  @media (max-width: 640px) { .modal.wide .field-grid { grid-template-columns: 1fr; } .modal.wide .field.span-2 { grid-column: 1 / -1; } }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(17, 24, 39, .5);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 50;
  }
  .modal {
    background: var(--card); border-radius: 12px; width: 100%; max-width: 560px;
    max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  .modal-header h2 { font-size: 17px; margin: 0; }
  .modal-close {
    border: none; background: none; font-size: 20px; line-height: 1; color: var(--muted);
    cursor: pointer; padding: 2px 8px; border-radius: 6px;
  }
  .modal-close:hover:not(:disabled) { background: var(--row-hover); color: var(--text); }
  .modal-body { padding: 18px 20px; }
  .field-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-bottom: 18px;
  }
  .field.span-2 { grid-column: 1 / -1; }
  .field label {
    display: block; font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .03em; margin-bottom: 3px;
  }
  .field-value {
    font-size: 14px; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px;
  }
  .field-value.code { font-family: Consolas, monospace; color: var(--accent); }
  .time-field {
    border-top: 1px dashed var(--border); padding-top: 16px; position: relative;
  }
  .time-field > label {
    display: block; font-size: 12.5px; font-weight: 700; color: var(--text); margin-bottom: 6px;
  }
  .time-input {
    width: 140px; padding: 9px 12px; border: 2px solid var(--accent); border-radius: 8px;
    font-size: 16px; font-weight: 700; text-align: left; background: #eef2fb;
  }
  .modal-error {
    margin-top: 8px; color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca;
    border-radius: 6px; padding: 6px 10px; font-size: 12.5px; display: inline-block;
  }
  .modal-actions {
    display: flex; justify-content: flex-end; gap: 10px;
    padding: 14px 20px; border-top: 1px solid var(--border);
  }
  .btn-primary, .btn-secondary {
    padding: 9px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn-primary { border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #1a3fc4; }
  .btn-secondary { border: 1px solid var(--border); background: #fff; color: var(--text); }
  .btn-secondary:hover:not(:disabled) { background: var(--row-hover); }
  .btn-primary:disabled, .btn-secondary:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

function useDebounced(value, ms) {
  const [v, setV] = useState(value);
  useEffect(() => {
    const t = setTimeout(() => setV(value), ms);
    return () => clearTimeout(t);
  }, [value, ms]);
  return v;
}

const LINK_MSG = {
  ok: { type: 'ok', text: 'Your Windows account is now linked — next time you can skip the password and sign in automatically.' },
  taken: { type: 'err', text: 'That Windows account is already linked to a different user.' },
  failed: { type: 'err', text: 'Could not detect your Windows identity. Try again from a domain-joined PC.' },
  unavailable: { type: 'err', text: 'Windows sign-in is not available on this server.' },
  domain: { type: 'err', text: 'Your Windows domain isn’t allowed to link here.' },
};

// Every column the table can show — the same set the CSV export carries —
// in display order. `def: true` = shown until the user changes the choice
// (remembered per browser under COLS_KEY). `render` gets the row and a few
// helpers from App (for the Time column's NEW/MODIFIED ribbon).
const dash = (v) => (v == null || v === '' ? '—' : v);
const COLUMN_DEFS = [
  { key: 'fullLaborOpCode', label: 'Full Op Code', def: true, cls: 'code' },
  { key: 'laborDescCode', label: 'Labor Desc Code', cls: 'code' },
  { key: 'baseLaborOp', label: 'Base Labor Op', cls: 'code' },
  { key: 'combo', label: 'Combo', cls: 'code' },
  { key: 'complexCode', label: 'Complexity' },
  { key: 'operationDesc', label: 'Operation', def: true },
  { key: 'operType', label: 'Op Type' },
  { key: 'categoryCode', label: 'Category', def: true },
  { key: 'catDesc', label: 'Category Desc', cls: 'muted' },
  { key: 'qualDesc', label: 'Qualifier', def: true, cls: 'muted', render: (r) => dash(r.qualDesc || r.catDesc) },
  { key: 'totTime', label: 'Time (hrs)', def: true, cls: 'num', align: 'right', render: (r, h) => (
      <React.Fragment>
        {h.isFresh(r) && r.changeType === 'added' && <span className="chg chg-new">NEW</span>}
        {h.isFresh(r) && r.changeType === 'modified' && <span className="chg chg-mod">MODIFIED</span>}
        {h.isFresh(r) && r.changeType === 'modified' && r.prevTotTime != null && (
          <s className="prev-time">{Number(r.prevTotTime).toFixed(1)}</s>
        )}
        {r.totTime != null ? r.totTime.toFixed(1) : '—'}
      </React.Fragment>
    ),
    title: (r, h) => (h.isFresh(r) ? `${r.changeType === 'added' ? 'Added' : 'Time modified'} ${formatWhen(r.changedAt)}` : undefined) },
  { key: 'assessedTime', label: 'Assessed Time' },
  { key: 'section', label: 'Section', def: true, cls: 'muted', render: (r) => `${r.secNo || ''} ${r.secDesc || ''}`.trim() || '—' },
  { key: 'secNo', label: 'Section No' },
  { key: 'vehDesc', label: 'Vehicle', def: true },
  { key: 'modYear', label: 'Year', def: true },
  { key: 'gsa', label: 'Country', render: (r) => r.gsa },
  { key: 'source', label: 'Source' },
  { key: 'brandCode', label: 'Brand' },
  { key: 'vehKey', label: 'Vehicle Key', cls: 'code' },
  { key: 'effectiveDate', label: 'Effective Date' },
  { key: 'status', label: 'Status' },
  { key: 'tsid', label: 'TSID', cls: 'code' },
  { key: 'changedAt', label: 'Changed On', cls: 'muted', render: (r, h) => (h.isFresh(r) ? formatWhen(r.changedAt) : '—') },
];
const DEFAULT_COLS = COLUMN_DEFS.filter((c) => c.def).map((c) => c.key);

const EyeIcon = () => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
    <circle cx="12" cy="12" r="3" />
  </svg>
);

// Every stored field of a labor-time row, grouped, for the details popup
// opened by the eye button. `span` widens a cell in the 3-column grid;
// `render` overrides the plain value (same helper signature as COLUMN_DEFS).
const DETAIL_GROUPS = [
  { title: 'Labor operation', fields: [
    { key: 'fullLaborOpCode', label: 'Full Op Code', cls: 'code' },
    { key: 'laborDescCode', label: 'Labor Desc Code', cls: 'code' },
    { key: 'baseLaborOp', label: 'Base Labor Op', cls: 'code' },
    { key: 'operationDesc', label: 'Operation', span: 3 },
    { key: 'combo', label: 'Combo' },
    { key: 'complexCode', label: 'Complexity' },
    { key: 'operType', label: 'Op Type' },
  ] },
  { title: 'Time', fields: [
    { key: 'totTime', label: 'Time (hrs)', render: (r, h) => COLUMN_DEFS.find((c) => c.key === 'totTime').render(r, h) },
    { key: 'prevTotTime', label: 'Previous Time (hrs)', render: (r, h) => (h.isFresh(r) && r.prevTotTime != null ? Number(r.prevTotTime).toFixed(1) : '—') },
    { key: 'changedAt', label: 'Changed On', render: (r, h) => (h.isFresh(r) ? `${r.changeType === 'added' ? 'Added' : 'Time modified'} ${formatWhen(r.changedAt)}` : '—') },
    { key: 'assessedTime', label: 'Assessed Time' },
    { key: 'categoryCode', label: 'Category' },
    { key: 'catDesc', label: 'Category Desc' },
    { key: 'qualDesc', label: 'Qualifier', span: 3 },
  ] },
  { title: 'Vehicle', fields: [
    { key: 'vehDesc', label: 'Vehicle', span: 2 },
    { key: 'vehKey', label: 'Vehicle Key', cls: 'code' },
    { key: 'modYear', label: 'Year' },
    { key: 'gsa', label: 'Country', render: (r, h) => h.countryName[r.gsa] || dash(r.gsa) },
    { key: 'source', label: 'Source' },
    { key: 'brandCode', label: 'Brand' },
  ] },
  { title: 'Section & time study', fields: [
    { key: 'secNo', label: 'Section No' },
    { key: 'secDesc', label: 'Section', span: 2 },
    { key: 'tsid', label: 'TSID', cls: 'code' },
    { key: 'effectiveDate', label: 'Effective Date' },
    { key: 'status', label: 'Status' },
    { key: 'id', label: 'Row ID', cls: 'muted' },
  ] },
];
const COLS_KEY = 'slts.columns';
function loadCols() {
  try {
    const saved = JSON.parse(localStorage.getItem(COLS_KEY));
    if (Array.isArray(saved) && saved.length) return saved.filter((k) => COLUMN_DEFS.some((c) => c.key === k));
  } catch (e) { /* ignore */ }
  return DEFAULT_COLS;
}
function saveCols(keys) { try { localStorage.setItem(COLS_KEY, JSON.stringify(keys)); } catch (e) { /* ignore */ } }

function App() {
  const [me, setMe] = useState(null); // { id, email, name, role } or null while loading
  const [visibleCols, setVisibleCols] = useState(loadCols); // ordered by COLUMN_DEFS, not by selection order
  const [colsOpen, setColsOpen] = useState(false);
  const [colsAlignRight, setColsAlignRight] = useState(false); // flip the menu when it would run off the right edge
  const colsRef = useRef(null);
  const colsMenuRef = useRef(null);
  useEffect(() => {
    if (!colsOpen || !colsMenuRef.current) return;
    const place = () => {
      const btn = colsRef.current.getBoundingClientRect();
      const menuWidth = colsMenuRef.current.offsetWidth;
      setColsAlignRight(btn.left + menuWidth > window.innerWidth - 16);
    };
    place();
    window.addEventListener('resize', place);
    return () => window.removeEventListener('resize', place);
  }, [colsOpen]);
  function setColVisible(key, on) {
    const next = COLUMN_DEFS.map((c) => c.key).filter((k) => (k === key ? on : visibleCols.includes(k)));
    if (next.length === 0) return; // keep at least one column
    setVisibleCols(next); saveCols(next);
  }
  function setAllCols(keys) { setVisibleCols(keys); saveCols(keys); }
  useEffect(() => {
    if (!colsOpen) return;
    const onDoc = (e) => { if (colsRef.current && !colsRef.current.contains(e.target)) setColsOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, [colsOpen]);
  const shownDefs = COLUMN_DEFS.filter((c) => visibleCols.includes(c.key));
  const [linkMsg, setLinkMsg] = useState(() => LINK_MSG[new URLSearchParams(location.search).get('link')] || null);
  const [maxLaborHours, setMaxLaborHours] = useState(999); // overwritten from /auth/public-config on load
  const [stats, setStats] = useState(null);
  const [lastUpdated, setLastUpdated] = useState(null); // latest audit_log change, shown in the header for every user
  const [vehicles, setVehicles] = useState([]);
  const [vehKey, setVehKey] = useState('');
  const [modYear, setModYear] = useState('');
  const [gsa, setGsa] = useState('');
  // "New items" / "Time modified" checkboxes -> the API's change filter

  const [showNew, setShowNew] = useState(false);
  const [showModified, setShowModified] = useState(false);
  const change = showNew && showModified ? 'any' : showNew ? 'added' : showModified ? 'modified' : '';
  const [changeHighlightDays, setChangeHighlightDays] = useState(7);
  const changeCutoffMs = Date.now() - changeHighlightDays * 24 * 60 * 60 * 1000;
  const isFresh = (r) => !!r.changeType && !!r.changedAt && new Date(r.changedAt).getTime() >= changeCutoffMs;
  // VIN (chassis number) search — a separate box; a search starts from a
  // clean slate (every other filter is cleared) and, when the VIN resolves
  // to exactly one loaded vehicle of that model year, selects it.
  const [vin, setVin] = useState('');
  const [vinResult, setVinResult] = useState(null); // /api/vin/decode response, or null
  const [vinBusy, setVinBusy] = useState(false);
  const [vinMapVehKey, setVinMapVehKey] = useState(''); // admin: vehicle chosen in the "map this code" form
  const [vinMapError, setVinMapError] = useState('');
  const [search, setSearch] = useState('');
  const [exactMode, setExactMode] = useState(false); // true right after clicking Search / pressing Enter
  const [page, setPage] = useState(1);
  const [data, setData] = useState({ rows: [], total: 0, limit: 50 });
  const [loading, setLoading] = useState(false);
  const [exporting, setExporting] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [uploadResults, setUploadResults] = useState(null); // { added, updated, failed, results }
  const [refreshTick, setRefreshTick] = useState(0); // bumped after a successful upload to force a re-fetch
  const fileInputRef = useRef(null);
  const liveQ = useDebounced(search, 350);
  const q = exactMode ? search.trim() : liveQ; // exact mode bypasses the debounce and uses the typed term as-is

  function refreshAll() {
    fetch('/api/stats').then(r => r.json()).then(setStats);
    fetch('/api/audit/last-updated').then(r => r.json()).then(d => setLastUpdated(d.lastUpdated));
    fetch('/api/vehicles').then(r => r.json()).then(setVehicles);

  }

  const [ssoAvailable, setSsoAvailable] = useState(false);

  useEffect(refreshAll, []);
  useEffect(() => {
    fetch('/auth/me').then(r => r.json()).then(d => { setMe(d.user); setSsoAvailable(d.ssoAvailable); });
    fetch('/auth/public-config').then(r => r.json()).then(d => {
      setMaxLaborHours(d.maxLaborHours);
      if (d.changeHighlightDays) setChangeHighlightDays(d.changeHighlightDays);

  async function logout() {

  }

  const canEdit = me && (me.role === 'ADMIN' || me.role === 'SUPER_ADMIN');

  useEffect(() => { setPage(1); }, [vehKey, modYear, gsa, change, q, exactMode]);

  // If the selected year/country no longer matches the selected vehicle, clear the vehicle
  useEffect(() => {
    if (!vehKey) return;
    const v = vehicles.find(v => v.vehKey === vehKey);

  }, [modYear, gsa]); // eslint-disable-line

  useEffect(() => {
    setLoading(true);
    const params = new URLSearchParams({ page, limit: 50 });
    if (vehKey) params.set('vehKey', vehKey);
    if (modYear) params.set('modYear', modYear);
    if (gsa) params.set('gsa', gsa);
    if (change) params.set('change', change);
    if (q) params.set('q', q);
    if (exactMode) params.set('exact', 'true');
    fetch('/api/laborops?' + params)
      .then(r => r.json())
      .then(d => { setData(d); setLoading(false); });
  }, [vehKey, modYear, gsa, change, q, exactMode, page, refreshTick]);

  const pages = Math.max(1, Math.ceil(data.total / data.limit));
  const visibleVehicles = vehicles.filter(v =>
    (!modYear || v.modYear === modYear) && (!gsa || v.gsa === gsa)
  );
  const countryName = { CHN: 'China', USA: 'United States', EU: 'Europe' };

  function runExactSearch() {
    setExactMode(true);
    setPage(1);
  }

  function onSearchChange(e) {
    setSearch(e.target.value);
    setExactMode(false); // typing again drops back to live partial-match search
  }

  function onSearchKeyDown(e) {
    if (e.key === 'Enter') runExactSearch();
  }

  function clearFilters() {
    setModYear('');
    setGsa('');
    setShowNew(false);
    setShowModified(false);
    setVehKey('');
    setSearch('');
    setExactMode(false);
    clearVin();
  }

  const hasFilters = modYear || gsa || change || vehKey || search.trim() || vin || vinResult;

  function onVinChange(e) {
    // Only letters and digits, upper-cased, capped at 17 — a VIN never has
    // I, O or Q, but those are left for the server to explain rather than
    // silently dropped while typing.
    setVin(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 17));
  }

  function clearVin() {
    setVin('');
    setVinResult(null);
    setVinMapVehKey('');
    setVinMapError('');
  }

  async function findByVin() {
    if (vin.length !== 17 || vinBusy) return;
    // Clean slate: a VIN search replaces whatever was filtered before.
    setModYear(''); setGsa(''); setVehKey(''); setSearch(''); setExactMode(false);
    setShowNew(false); setShowModified(false); setPage(1);
    setVinMapVehKey(''); setVinMapError('');
    setVinBusy(true);
    try {
      const res = await fetch('/api/vin/decode?vin=' + encodeURIComponent(vin));
      const d = await res.json();
      setVinResult(d);
      if (d.ok && d.best) setVehKey(d.best.vehKey);
    } catch (err) {
      setVinResult({ ok: false, error: String(err) });
    } finally {
      setVinBusy(false);
    }
  }

  // Admin: record "this WMI + body code = that vehicle line" and search again.
  async function saveVinMapping() {
    const v = vehicles.find(x => x.vehKey === vinMapVehKey);
    if (!v || !vinResult || !vinResult.ok) return;
    setVinBusy(true); setVinMapError('');
    try {
      const res = await fetch('/api/vin/map', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ wmi: vinResult.parsed.wmi, bodyCode: vinResult.parsed.bodyCode, gsa: v.gsa, vehCode: v.vehCode, note: 'added from VIN ' + vinResult.parsed.vin }),
      });
      const d = await res.json();
      if (!res.ok) { setVinMapError(d.error || 'Could not save'); return; }
      setVinBusy(false);
      await findByVin();
    } catch (err) {
      setVinMapError(String(err));
    } finally {
      setVinBusy(false);
    }
  }
  // One entry per vehicle line + market (a mapping applies to every model year of the line).
  const vehicleLines = vehicles.filter((v, i, a) => a.findIndex(x => x.gsa === v.gsa && x.vehCode === v.vehCode) === i);

  function exportCsv() {
    setExporting(true);
    const params = new URLSearchParams();
    if (vehKey) params.set('vehKey', vehKey);
    if (modYear) params.set('modYear', modYear);
    if (gsa) params.set('gsa', gsa);
    if (change) params.set('change', change);
    if (q) params.set('q', q);
    if (exactMode) params.set('exact', 'true');

    // downloads the file without leaving the page.

    a.remove();

  }

  // Edit popup: shows the full row as read-only context, with only totTime
  // editable — the server-side route only ever writes that one field too.
  // Details popup (eye button, every user): the whole row, read-only.
  const [viewRow, setViewRow] = useState(null);
  useEffect(() => {
    if (!viewRow) return;
    const onKey = (e) => { if (e.key === 'Escape') setViewRow(null); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [viewRow]);

  const [editRow, setEditRow] = useState(null); // the row object currently open in the popup, or null
  const [editValue, setEditValue] = useState('');
  const [saving, setSaving] = useState(false);
  const [editError, setEditError] = useState('');

  function openEdit(row) {
    setEditRow(row);
    setEditValue(row.totTime != null ? String(row.totTime) : '');
    setEditError('');
  }

  function closeEdit() {
    if (saving) return;
    setEditRow(null);
    setEditError('');
  }

  useEffect(() => {
    if (!editRow) return;

    return () => document.removeEventListener('keydown', onKey);
  }, [editRow, saving]); // eslint-disable-line

  async function saveEdit() {
    if (!editRow) return;
    const n = Number(editValue);
    if (!Number.isFinite(n) || n < 0 || n > maxLaborHours) {
      setEditError(`Enter a number between 0 and ${maxLaborHours}`);
      return;
    }
    setSaving(true);
    setEditError('');
    try {
      const res = await fetch('/api/laborops/' + editRow.id, {
        method: 'PATCH',

      const id = editRow.id;
      setData(prev => ({
        ...prev,
        rows: prev.rows.map(r => (r.id === id ? { ...r, totTime: d.row.totTime } : r)),

      setEditError(String(err.message || err));

      setSaving(false);

  function triggerImport() {
    if (fileInputRef.current) fileInputRef.current.click();

  async function onFilesSelected(e) {
    const files = e.target.files;
    if (!files || files.length === 0) return;

    setUploading(true);
    setUploadResults(null);

    <div className="layout">

    <div className="wrap">
      <div className="header-row">

          : 'Loading…'}
        {me && ssoAvailable && !me.windowsUsername && (

      </div>

        </div>

      {uploadResults && (
        <div className="upload-banner">
          <button className="banner-close" onClick={() => setUploadResults(null)} title="Dismiss">×</button>

      </div>

      {vinResult && (
        <div className={'vin-banner ' + (vinResult.ok ? (vinResult.best ? 'ok' : 'warn') : 'err')}>

            <React.Fragment>

                  <span>

                    {vinResult.best.modelDesc ? ' · ' + vinResult.best.modelDesc : ''}{vinResult.best.bodyStyleDesc ? ' · ' + vinResult.best.bodyStyleDesc : ''}
                    {vinResult.best.note ? ' · ' + vinResult.best.note : ''}
                  </span>
                ) : vinResult.matches.length ? (
                  <span>VIN {vinResult.parsed.vin}: no {vinResult.parsed.modelYear} data is loaded for this vehicle line — pick a year below.</span>
                ) : (

                )}
              </div>
              <div className="vin-meta">
                {vinResult.parsed.manufacturer} · built in {vinResult.parsed.region} · model year {vinResult.parsed.modelYear ?? '?'} · body code {vinResult.parsed.bodyCode} · engine code {vinResult.parsed.engineCode} · plant {vinResult.parsed.plantCode} · serial {vinResult.parsed.serial}
                {vinResult.via ? ' · matched via ' + (vinResult.via === 'manual' ? 'admin mapping' : 'the extract') : ''}
              </div>
              {vinResult.matches.length > 0 && (
                <div className="vin-choices">
                  {vinResult.matches.map(m => (
                    <button key={m.vehKey} className={'vin-choice' + (vehKey === m.vehKey ? ' on' : '')} onClick={() => setVehKey(m.vehKey)}>
                      {m.modYear} · {m.vehDesc} ({countryName[m.gsa] || m.gsa}){m.exactYear ? '' : ' — other year'}
                    </button>
                  ))}
                </div>
              )}
              {vinResult.matches.length === 0 && canEdit && (
                <div className="vin-map-form">
                  <span>Map body code <strong>{vinResult.parsed.bodyCode}</strong> (WMI {vinResult.parsed.wmi}) to:</span>
                  <select value={vinMapVehKey} onChange={e => setVinMapVehKey(e.target.value)}>
                    <option value="">Choose vehicle line…</option>
                    {vehicleLines.map(v => <option key={v.vehKey} value={v.vehKey}>{v.vehDesc} ({countryName[v.gsa] || v.gsa}) · code {v.vehCode}</option>)}
                  </select>
                  <button className="btn-primary" disabled={!vinMapVehKey || vinBusy} onClick={saveVinMapping}>Save mapping</button>
                  {vinMapError && <span className="vin-map-error">{vinMapError}</span>}
                </div>
              )}
            </React.Fragment>
          )}
        </div>
      )}

      <div className="controls">
        <select className="narrow" value={modYear} onChange={e => setModYear(e.target.value)}>
          <option value="">All years</option>
          {stats && stats.years.map(y => <option key={y} value={y}>{y}</option>)}
        </select>
        <select className="narrow" value={gsa} onChange={e => setGsa(e.target.value)}>
          <option value="">All countries</option>
          {stats && stats.markets.map(m => (
            <option key={m} value={m}>{countryName[m] || m}</option>
          ))}
        </select>
        <select value={vehKey} onChange={e => setVehKey(e.target.value)}>
          <option value="">
            All vehicles{modYear ? ` · ${modYear}` : ''}{gsa ? ` · ${countryName[gsa] || gsa}` : ''}
          </option>
          {visibleVehicles.map(v => (
            <option key={v.vehKey + v.fileName} value={v.vehKey}>
              {v.modYear || '—'} · {v.vehDesc} ({v.gsa})
            </option>
          ))}
        </select>
        <div className="search-box">
          <input
            type="text"
            className={exactMode ? 'exact' : ''}
            placeholder="Search description, or enter a code and click Search for an exact match…"
            value={search}
            onChange={onSearchChange}
            onKeyDown={onSearchKeyDown}
          />
          {exactMode && <span className="exact-tag">EXACT</span>}
        </div>
        <button className="search" onClick={runExactSearch} disabled={!search.trim()}>
          Search
        </button>
        <button className="clear" onClick={clearFilters} disabled={!hasFilters}>
          Clear
        </button>
        <div className="cols-picker" ref={colsRef}>
          <button className="cols-btn" onClick={() => setColsOpen(o => !o)} title="Choose which columns the table shows">
            Columns ({shownDefs.length}/{COLUMN_DEFS.length})
          </button>
          {colsOpen && (
            <div className={'cols-menu' + (colsAlignRight ? ' align-right' : '')} ref={colsMenuRef}>
              <div className="cols-menu-head">
                <span>Show columns</span>
                <button onClick={() => setAllCols(COLUMN_DEFS.map(c => c.key))}>All</button>
                <button onClick={() => setAllCols(DEFAULT_COLS)}>Default</button>
              </div>
              {COLUMN_DEFS.map((c) => (
                <label key={c.key} className="cols-item">
                  <input type="checkbox" checked={visibleCols.includes(c.key)} onChange={e => setColVisible(c.key, e.target.checked)} />
                  {c.label}
                </label>
              ))}
            </div>
          )}
        </div>
        <div className="change-toggles" title={`Entries added or changed in the last ${changeHighlightDays} days`}>
          <label className={'toggle' + (showNew ? ' on' : '')}>
            <input type="checkbox" checked={showNew} onChange={e => setShowNew(e.target.checked)} />
            <span className="chg chg-new">NEW</span> New items
          </label>
          <label className={'toggle' + (showModified ? ' on' : '')}>
            <input type="checkbox" checked={showModified} onChange={e => setShowModified(e.target.checked)} />
            <span className="chg chg-mod">MODIFIED</span> Time modified
          </label>
          <span className="toggle-hint">last {changeHighlightDays} days</span>
        </div>
      </div>

      <div className="card">
        <div className="tablewrap">
          <div className="table-scroll">
          <table>
            <thead>
              <tr>
                <th className="view-col" aria-label="View"></th>
                {shownDefs.map((c) => (
                  <th key={c.key} style={c.align ? { textAlign: c.align } : undefined}>{c.label}</th>
                ))}
                {canEdit && <th style={{textAlign:'right'}}>Actions</th>}
              </tr>
            </thead>
            <tbody>
              {data.rows.map((r) => (
                <tr key={r.id}>
                  <td className="view-col">
                    <button className="row-view" title="View all details" aria-label="View all details" onClick={() => setViewRow(r)}><EyeIcon /></button>
                  </td>
                  {shownDefs.map((c) => (
                    <td key={c.key} className={c.cls} title={c.title ? c.title(r, { isFresh }) : undefined}>
                      {c.render ? c.render(r, { isFresh }) : dash(r[c.key])}
                    </td>
                  ))}
                  {canEdit && (
                    <td style={{textAlign:'right'}}>
                      <button className="row-edit" onClick={() => openEdit(r)}>Edit</button>
                    </td>
                  )}
                </tr>
              ))}
            </tbody>
          </table>
          </div>
          {!loading && data.rows.length === 0 && <div className="empty">No matching labor operations.</div>}
          {loading && <div className="empty">Loading…</div>}
        </div>
        <div className="pager">
          <span className="muted">{data.total.toLocaleString()} rows · page {page} of {pages.toLocaleString()}</span>
          <button disabled={page <= 1} onClick={() => setPage(p => p - 1)}>Prev</button>
          <button disabled={page >= pages} onClick={() => setPage(p => p + 1)}>Next</button>
        </div>
      </div>

      {viewRow && (
        <div className="modal-overlay" onClick={() => setViewRow(null)}>
          <div className="modal wide" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2>Labor operation details — <span style={{ fontFamily: 'Consolas, monospace', color: 'var(--accent)' }}>{viewRow.fullLaborOpCode}</span></h2>
              <button className="modal-close" onClick={() => setViewRow(null)} title="Close">×</button>
            </div>
            <div className="modal-body">
              <div className="field-grid">
                {DETAIL_GROUPS.map((g) => (
                  <React.Fragment key={g.title}>
                    <div className="detail-group">{g.title}</div>
                    {g.fields.map((f) => (
                      <div key={f.key} className={'field' + (f.span ? ' span-' + f.span : '')}>
                        <label>{f.label}</label>
                        <div className={'field-value' + (f.cls ? ' ' + f.cls : '')}>
                          {f.render ? f.render(viewRow, { isFresh, countryName }) : dash(viewRow[f.key])}
                        </div>
                      </div>
                    ))}
                  </React.Fragment>
                ))}
              </div>
            </div>
            <div className="modal-actions">
              {canEdit && <button className="btn-secondary" onClick={() => { setViewRow(null); openEdit(viewRow); }}>Edit time</button>}
              <button className="btn-primary" onClick={() => setViewRow(null)}>Close</button>
            </div>
          </div>
        </div>
      )}

      {editRow && (
        <div className="modal-overlay" onClick={closeEdit}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2>Edit labor time</h2>
              <button className="modal-close" onClick={closeEdit} disabled={saving} title="Close">×</button>
            </div>

            <div className="modal-body">
              <div className="field-grid">
                <div className="field">
                  <label>Full Op Code</label>
                  <div className="field-value code">{editRow.fullLaborOpCode}</div>
                </div>
                <div className="field">
                  <label>Base Op Code</label>
                  <div className="field-value">{editRow.laborDescCode}</div>
                </div>
                <div className="field span-2">
                  <label>Operation</label>
                  <div className="field-value">{editRow.operationDesc}</div>
                </div>
                <div className="field">
                  <label>Category</label>
                  <div className="field-value">{editRow.categoryCode}</div>
                </div>
                <div className="field">
                  <label>Qualifier</label>
                  <div className="field-value">{editRow.qualDesc || editRow.catDesc || '—'}</div>
                </div>
                <div className="field">
                  <label>Vehicle</label>
                  <div className="field-value">{editRow.vehDesc}</div>
                </div>
                <div className="field">
                  <label>Year · Country</label>
                  <div className="field-value">{editRow.modYear || '—'} · {countryName[editRow.gsa] || editRow.gsa}</div>
                </div>
                <div className="field span-2">
                  <label>Section</label>
                  <div className="field-value">{editRow.secNo} {editRow.secDesc}</div>
                </div>
                <div className="field">
                  <label>Status</label>
                  <div className="field-value">{editRow.status}</div>
                </div>
                <div className="field">
                  <label>Effective Date</label>
                  <div className="field-value">{editRow.effectiveDate}</div>
                </div>
              </div>

              <div className="time-field">
                <label htmlFor="time-edit-input">Time (hrs) — only field you can change</label>
                <input
                  id="time-edit-input"
                  type="number" step="0.1" min="0" max={maxLaborHours}
                  className="time-input"
                  value={editValue}
                  autoFocus
                  disabled={saving}
                  onChange={e => setEditValue(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') saveEdit(); }}
                />
                {editError && <div className="modal-error">{editError}</div>}
              </div>
            </div>

            <div className="modal-actions">
              <button className="btn-secondary" onClick={closeEdit} disabled={saving}>Cancel</button>
              <button className="btn-primary" onClick={saveEdit} disabled={saving}>{saving ? 'Saving…' : 'Save'}</button>
            </div>
          </div>
        </div>
      )}
    </div>
    </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
