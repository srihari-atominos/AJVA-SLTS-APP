<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign up — SLTS</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1a2233; --muted:#6b7486; --accent:#1d4ed8; --border:#e2e5ea; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 380px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13.5px; margin-bottom: 16px; }
  .role-note {
    background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; border-radius: 8px;
    padding: 9px 12px; font-size: 12.5px; margin-bottom: 16px;
  }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 12px 0 4px; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
  }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  button.submit {
    width: 100%; margin-top: 18px; padding: 11px; border: 1px solid var(--accent); background: var(--accent);
    color: #fff; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  button.submit:hover:not(:disabled) { background: #1a3fc4; }
  button.submit:disabled { opacity: .6; cursor: default; }
  .msg { margin-top: 14px; padding: 9px 12px; border-radius: 8px; font-size: 13px; }
  .msg.err { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .alt { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .alt a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .alt a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <h1>Create your account</h1>
    <div class="sub">SLTS</div>
    <div class="role-note" id="roleNote">New accounts start with Viewer access (browse &amp; export only). An admin can grant more later.</div>

    <form id="signupForm">
      <label for="name">Name (optional)</label>
      <input id="name" type="text" autocomplete="name" />
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="new-password" required />
      <div class="hint" id="pwHint">At least 8 characters.</div>
      <button class="submit" type="submit" id="submitBtn">Create account</button>
    </form>

    <div id="msg"></div>
    <div class="alt">Already have an account? <a href="/login.html">Sign in</a></div>
  </div>

<script>
  const msgEl = document.getElementById('msg');

  fetch('/auth/public-config').then(r => r.json()).then(cfg => {
    const n = cfg.passwordMinLength;
    document.getElementById('password').setAttribute('minlength', n);
    document.getElementById('pwHint').textContent = `At least ${n} characters.`;
  }).catch(() => {});

  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account…';
    msgEl.className = ''; msgEl.textContent = '';
    try {
      const res = await fetch('/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      const d = await res.json();
      if (!res.ok) throw new Error(d.error || 'Could not create account');
      location.href = '/';
    } catch (err) {
      msgEl.className = 'msg err';
      msgEl.textContent = String(err.message || err);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create account';
    }
  });
</script>
</body>
</html>
